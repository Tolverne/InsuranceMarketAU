name: M1.4a independent validation and sampling diagnostics

on:
  pull_request:
    paths:
      - "src/insurance_market_au/data_foundation/m13b.py"
      - "src/insurance_market_au/data_foundation/m14.py"
      - "scripts/m14_validate.py"
      - "apps/m14_validation_panel.py"
      - "apps/m13b_explorer.py"
      - "tests/test_m14_diagnostics.py"
      - ".github/workflows/m1-4a-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-independent-analytic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project for source, model and analysis tests
        run: python -m pip install -e ".[data,model,dev]"
      - name: Compile model, CLI and Streamlit interfaces
        run: python -m py_compile src/insurance_market_au/data_foundation/m14.py scripts/m14_validate.py apps/m13b_explorer.py
      - name: Validate independent holdout, source contracts, reproducibility and M1.3 regression
        run: python -m pytest -q tests/test_m14_diagnostics.py tests/test_m13b_conditional.py tests/test_m13_calibration.py
