name: Validate M0 documentation and contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate manifests and doc references
        run: python scripts/validate_repository.py
      - name: Test contract invariants
        run: pytest -q
