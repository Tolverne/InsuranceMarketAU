name: M1.5 authentic BITRE release and frozen population consumer audit

# Intentionally heavyweight: one initial PR audit, then workflow_dispatch.
on:
  pull_request:
    paths:
      - ".github/workflows/m1-5-real-release-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-research-asset-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data/model and JSON contract requirements
        run: python -m pip install -e ".[data,model,dev]"
      - name: Run isolated publication and existing model fixture tests
        run: python -m pytest -q tests/test_m15_population.py tests/test_m14b_calibration.py tests/test_m14_diagnostics.py tests/test_m13b_conditional.py
      - name: Download SHA-pinned official BITRE workbook plus model sources
        run: |
          python scripts/download_vehicle_sources.py --groups bitre --only bitre_summary --static-only --download
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          a=json.loads(Path('catalog/acquisition/bitre-2026-acquired-metadata.json').read_text())
          by={r['projection_id']:r for r in a['resources'] if 'projection_id' in r}
          required=('B26-01','B26-02','B26-03','B26-04','B26-05','B26-06',
                    'B26-07','B26-08','B26-09','B26-10','B26-13','B26-15')
          for pid in required:
              print('M15_SOURCE',pid,by[pid]['sha256'][:12],flush=True)
              subprocess.run([sys.executable,'scripts/download_vehicle_sources.py',
                              '--groups','bitre','--only',by[pid]['resource_id'],
                              '--download'],check=True)
          PY
      - name: Stage verified publisher stock and four-way published controls
        run: |
          python - <<'PY'
          from pathlib import Path
          from insurance_market_au.data_foundation.m11_controls import extract_workbook_controls,find_workbook,write_controls
          controls=extract_workbook_controls(find_workbook())
          assert controls['national_total']==22771150
          write_controls(controls,Path('data/processed/m1/controls'))
          PY
          python scripts/m1_ingest.py --selected B26-01,B26-02,B26-03,B26-04,B26-05,B26-06,B26-07,B26-08,B26-09,B26-10,B26-13,B26-15 --parquet --batch-rows 20000
      - name: Build unchanged M1.3a and M1.3b sample and optional M1.4b research candidate
        run: |
          python scripts/m13_fit.py --iterations 32
          python scripts/m13b_expand.py --rows 85000 --seed 42
          python scripts/m14b_calibrate.py --rounds 4
      - name: Freeze both baseline and candidate in immutable M1.5 registry
        run: |
          python scripts/m15_release.py --publish both
          python scripts/m15_release.py --list
      - name: Verify frozen source control, independent discovery and typed consumer data contract
        run: |
          python - <<'PY'
          import json,math,os
          from pathlib import Path
          from insurance_market_au.data_foundation.m1 import ROOT
          from insurance_market_au.population import PopulationStore,list_populations,publish_population,verify_population
          entries=list_populations()
          assert len(entries)==2,entries
          assert len(set(e['release_id'] for e in entries))==2
          assert all(e['status']=='published' and e['commercially_approved'] is False for e in entries)
          summaries={}
          for entry in entries:
              rid=entry['release_id']
              report=verify_population(ROOT,rid)
              assert report['verified'] is True
              assert report['physical_checks']['synthetic_rows']==85000
              assert report['physical_checks']['fourway_positive_support']==64008
              assert report['physical_checks']['maximum_fourway_count_residual']<1e-5
              assert abs(report['physical_checks']['expected_vehicles']-22771150)<.1
              assert report['quality']['quality_gates']['commercial_pricing_use_approved'] is False
              assert report['manifest']['status']=='published'
              store=PopulationStore(rid)
              pin=store.pin()
              assert pin['population_release_id']==rid
              assert pin['commercial_use_approved'] is False
              assert len(pin['population_asset_sha256'])==64
              aggregate=store.aggregate(group_by=('registered_state',),max_groups=10)
              assert aggregate['total_synthetic_rows']==85000
              assert abs(aggregate['total_estimated_registered_vehicles']-22771150)<.1
              assert len(aggregate['returned_groups'])==8
              # Select an actually published category rather than guessing
              # whether the source uses Qld, QLD or Queensland labels.
              state=aggregate['returned_groups'][0]['dimensions']['registered_state']
              assert sum(b.num_rows for b in store.iter_feature_view(filters={'registered_state':state}))>0
              assert publish_population(ROOT,kind=report['quality']['model_kind'])['created'] is False
              summaries[report['quality']['model_kind']]={'release_id':rid,'data_sha256':pin['population_asset_sha256']}
              print('M15_REAL_RELEASE_VERIFIED',report['quality']['model_kind'],rid,
                    'fleet',report['physical_checks']['expected_vehicles'],
                    'support',report['physical_checks']['fourway_positive_support'])
          assert set(summaries)=={'baseline','candidate'}
          assert summaries['baseline']['release_id']!=summaries['candidate']['release_id']
          print('M15_BOTH_RESEARCH_RELEASES_READY_NO_COMMERCIAL_PROMOTION')
          PY
      - name: Upload metadata and source provenance only, no sample or original source records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m15-research-release-manifests-${{ github.run_id }}
          path: |
            data/releases/population/*/manifest.json
            data/releases/population/*/quality-report.json
          if-no-files-found: ignore
          retention-days: 14
