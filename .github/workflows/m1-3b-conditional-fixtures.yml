name: M1.3b conditional synthetic-weighted sample tests

on:
  pull_request:
    paths:
      - "src/insurance_market_au/data_foundation/m13b.py"
      - "tests/test_m13b_conditional.py"
      - "scripts/m13b_expand.py"
      - ".github/workflows/m1-3b-conditional-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-conditioned-synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source and model dependencies
        run: python -m pip install -e ".[data,model,dev]"
      - name: Run conditional inference and sample invariants
        run: python -m pytest -q tests/test_m13b_conditional.py tests/test_m13_calibration.py
